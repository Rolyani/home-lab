apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mp-telegram-bot
  namespace: mp-telegram-bot
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: mp-telegram-bot
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
